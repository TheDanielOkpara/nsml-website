name: Deploy to cPanel

# Runs on every push to main. SSHes into the cPanel server and runs a
# git pull inside public_html (which is itself the cloned repo). Untracked
# files on the server — config.local.php and cms/uploads — are preserved,
# because git pull only touches tracked files.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # also allows manual "Run workflow" from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code on the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          script: |
            cd ~/public_html
            git fetch origin main
            git reset --hard origin/main
            echo "Deployed commit: $(git rev-parse --short HEAD)"
