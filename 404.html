<head>

  <meta property="og:image" content="https://nilayosports.com/images/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Page Not Found — Nilayo Sports Management">
  <meta name="twitter:description" content="This page took a wrong turn and crossed the line early. Head back to NSML's home, properties, news, or contact page.">
  <meta name="twitter:image" content="https://nilayosports.com/images/og-image.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/nav.js"></script>
  <style>
    .err-hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      background: var(--navy);
      padding: 8rem 1.5rem 5rem;
    }
    .err-hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('images/events/lagos/DJI_0251.jpg');
      background-size: cover;
      background-position: center;
      filter: grayscale(0.5) contrast(1.1);
      opacity: 0.14;
    }
    .err-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(13,31,60,0.97) 0%, rgba(13,31,60,0.82) 100%);
    }
    .err-hero-inner {
      position: relative;
      z-index: 2;
      max-width: 40rem;
    }
    .err-code {
      font-family: var(--font-d);
      font-size: clamp(5rem, 16vw, 10rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.9;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    .err-code .hi { color: var(--green); }
    .err-h1 {
      font-family: var(--font-d);
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 1rem;
    }
    .err-h1 .hi { color: var(--green); }
    .err-p {
      font-size: 1.0625rem;
      color: rgba(255,255,255,0.65);
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    .err-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.875rem;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div id="nav-root"></div>

  <div class="err-hero">
    <div class="err-hero-bg" aria-hidden="true"></div>
    <div class="err-hero-overlay" aria-hidden="true"></div>
    <div class="err-hero-inner">
      <div class="eyebrow-pill" style="margin-bottom:1.5rem;display:inline-flex" data-reveal>
        <span class="eyebrow-dot"></span>
        Wrong Turn
      </div>
      <div class="err-code" data-reveal>4<span class="hi">0</span>4</div>
      <h1 class="err-h1" data-reveal>You've Run Off <span class="hi">The Course</span></h1>
      <p class="err-p" data-reveal>This page crossed the finish line a while back — or never existed at all. Let's get you back on track.</p>
      <div class="err-actions" data-reveal>
        <a href="/" class="btn btn-fill">
          <span>Back to Home</span>
          <span class="btn-icon">↗</span>
        </a>
        <a href="/properties" class="btn btn-outline-white">
          <span>View Properties</span>
        </a>
        <a href="/news" class="btn btn-outline-white">
          <span>Read News</span>
        </a>
        <a href="/contact" class="btn btn-outline-white">
          <span>Contact Us</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (!entry.isIntersecting) return;
        const el = entry.target;
        setTimeout(() => {
          el.style.transition = 'opacity 0.75s cubic-bezier(0.32,0.72,0,1), transform 0.75s cubic-bezier(0.32,0.72,0,1)';
          el.style.opacity = '1'; el.style.transform = 'none';
        }, i * 75);
        io.unobserve(el);
      });
    }, { threshold: 0.08 });

    document.querySelectorAll('[data-reveal]').forEach(el => io.observe(el));
  </script>
</body>
</html>
